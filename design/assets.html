<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Assets del perfil de zJuqni</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #030303; color: #f4f4f2; font-family: "Segoe UI", sans-serif; }
    .hero { width: 1280px; height: 440px; position: relative; overflow: hidden; padding: 55px 66px; background: #030303; }
    .hero::before { content: ""; position: absolute; inset: 0 0 0 60%; background: linear-gradient(90deg, #030303, transparent 40%), linear-gradient(#181818 1px, transparent 1px), linear-gradient(90deg, #181818 1px, transparent 1px); background-size: auto, 48px 48px, 48px 48px; opacity: .6; }
    .brand { display: flex; align-items: center; gap: 16px; font-size: 20px; color: #aaa; }
    .brand img { width: 32px; height: 32px; image-rendering: pixelated; }
    h1 { position: relative; margin: 25px 0 0; font-size: 126px; font-weight: 750; line-height: 1.06; letter-spacing: -8px; }
    .lede { position: relative; margin: 16px 0 0; font-size: 28px; color: #d1d1cf; letter-spacing: -.5px; }
    .tags { position: absolute; bottom: 45px; display: flex; gap: 12px; }
    .tags span { border: 1px solid #303030; border-radius: 5px; padding: 8px 16px; font-size: 17px; color: #bcbcbc; }
    .avatar { position: absolute; width: 410px; height: 410px; right: 48px; bottom: 0; image-rendering: pixelated; }
    .card { width: 720px; height: 405px; position: relative; overflow: hidden; margin-top: 30px; }
    .geo { background: #ffd324; display: grid; align-items: center; }
    .geo img { width: 720px; height: 240px; object-fit: contain; }
    .doc { padding: 48px; background: #101112; }
    .doc img { width: 78px; height: 78px; border-radius: 12px; }
    .doc h2 { margin: 23px 0 5px; font-size: 58px; letter-spacing: -2px; }
    .doc p { margin: 0; color: #b5b9bd; font-size: 22px; }
    .formats { display: flex; gap: 10px; position: absolute; bottom: 43px; }
    .formats span { border: 1px solid #414447; border-radius: 5px; padding: 10px 18px; font-size: 19px; }
    .beyond img { width: 720px; height: 405px; object-fit: cover; }
    .sound { display: flex; align-items: center; gap: 35px; padding: 48px; background: #0a0a0a; }
    .sound img { width: 164px; height: 138px; object-fit: contain; image-rendering: pixelated; }
    .sound h2 { margin: 0 0 12px; font-size: 52px; letter-spacing: -2px; }
    .sound p { margin: 0; font-size: 21px; line-height: 1.5; color: #adadad; }
    .icon { width: 64px; height: 64px; padding: 12px; border-radius: 12px; background: #f4f4f2; display: inline-flex; align-items: center; justify-content: center; margin: 20px 4px; }
    .icon img { width: 40px; height: 40px; object-fit: contain; }
  </style>
</head>
<body>
  <header class="hero" id="header">
    <div class="brand"><img src="../assets/source/zjuqni-logo.png" alt="">Software Developer</div>
    <h1>zJuqni</h1>
    <p class="lede">Software, sistemas y experiencias.</p>
    <div class="tags"><span>Java</span><span>Python</span><span>Web</span><span>Minecraft</span></div>
    <img class="avatar" src="../assets/source/zjuqni.png" alt="Avatar de zJuqni">
  </header>
  <section class="card geo" id="geoware"><img src="../assets/source/geoware.webp" alt="GeoWare World"></section>
  <section class="card doc" id="docupilot"><img src="../assets/source/docupilot.svg" alt=""><h2>DocuPilot</h2><p>Tus documentos. En tu equipo.</p><div class="formats"><span>PDF</span><span>DOCX</span><span>OCR</span><span>TTS</span></div></section>
  <section class="card beyond" id="beyond"><img src="../assets/source/beyond.webp" alt="Sala virtual de Beyond"></section>
  <section class="card sound" id="soundpixel"><img src="../assets/source/soundpixel.webp" alt=""><div><h2>SoundPixel</h2><p>Audio personalizado.<br>Dentro de Minecraft.</p></div></section>
  <div class="icon" id="tech-java-classic"><img src="../assets/stack/java-classic.svg" alt="Java"></div>
  <div class="icon" id="tech-python"><img src="../assets/stack/python.svg" alt="Python"></div>
  <div class="icon" id="tech-javascript"><img src="../assets/stack/javascript.svg" alt="JavaScript"></div>
  <div class="icon" id="tech-typescript"><img src="../assets/stack/typescript.svg" alt="TypeScript"></div>
  <div class="icon" id="tech-react"><img src="../assets/stack/react.svg" alt="React"></div>
  <div class="icon" id="tech-nodejs"><img src="../assets/stack/nodejs.svg" alt="Node.js"></div>
  <div class="icon" id="tech-postgresql"><img src="../assets/stack/postgresql.svg" alt="PostgreSQL"></div>
  <div class="icon" id="tech-docker"><img src="../assets/stack/docker.svg" alt="Docker"></div>
</body>
</html>
